<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Slip — Staff Evaluation Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdfcf6;
    --paper-shade:#f2efe3;
    --ink:#1c1a16;
    --ink-soft:#5a564c;
    --line:#d8d3c2;
    --stamp-red:#b3271e;
    --stamp-green:#2f6b3a;
    --stamp-amber:#c9820f;
    --hole:#e9e4d3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper-shade);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    padding:24px 12px 60px;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* ---- ticket shell ---- */
  .ticket{
    background:var(--paper);
    border:1px solid var(--line);
    position:relative;
    box-shadow:0 2px 0 var(--line), 0 18px 30px -20px rgba(0,0,0,0.35);
  }
  .ticket::before,
  .ticket::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:12px;
    background-image: radial-gradient(circle at 10px 6px, var(--paper-shade) 6px, transparent 7px);
    background-size:20px 12px;
    background-repeat:repeat-x;
  }
  .ticket::before{ top:-11px; }
  .ticket::after{ bottom:-11px; transform:rotate(180deg); }

  .ticket-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:26px 28px 16px;
    border-bottom:2px dashed var(--line);
    gap:16px; flex-wrap:wrap;
  }
  .ticket-head h1{ font-size:26px; margin:0; line-height:1.05;}
  .ticket-head .sub{ font-size:11px; color:var(--ink-soft); margin-top:4px; letter-spacing:1.5px;}
  .stamp{
    border:2px solid var(--stamp-red);
    color:var(--stamp-red);
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:11px;
    padding:6px 10px;
    transform:rotate(-6deg);
    letter-spacing:1px;
    white-space:nowrap;
  }

  .tabs{ display:flex; gap:0; border-bottom:2px dashed var(--line); }
  .tab-btn{
    flex:1; padding:12px 10px; background:none; border:none; cursor:pointer;
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:1px; text-transform:uppercase;
    font-size:13px; color:var(--ink-soft); border-bottom:3px solid transparent;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--stamp-amber); }

  .panel{ padding:24px 28px 30px; display:none; }
  .panel.active{ display:block; }

  /* ---- form fields ---- */
  .field-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .field{ flex:1 1 200px; }
  label{ display:block; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=date], textarea{
    width:100%; font-family:'Space Mono', monospace; font-size:14px;
    background:transparent; border:none; border-bottom:1.5px solid var(--line);
    padding:6px 2px; color:var(--ink); outline:none;
  }
  input:focus, textarea:focus{ border-bottom-color:var(--stamp-amber); }
  textarea{ resize:vertical; min-height:70px; border:1.5px solid var(--line); padding:10px; }

  /* ---- factor / punch card ---- */
  .factor{ margin:22px 0 26px; border-top:1px solid var(--line); padding-top:16px; }
  .factor-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .factor-head h3{ font-size:15px; margin:0; }
  .factor-num{ color:var(--stamp-amber); }
  .factor-points{ font-size:12px; color:var(--ink-soft); }
  .bands{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .band-card{
    border:1.5px solid var(--line); padding:10px 8px 12px; cursor:pointer;
    background:var(--paper); transition:border-color .15s, background .15s;
    display:flex; flex-direction:column; gap:8px; min-height:150px;
  }
  .band-card:hover{ border-color:var(--stamp-amber); }
  .band-card.selected{ border-color:var(--ink); background:#faf7ec; }
  .punch{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--ink-soft);
    align-self:center; position:relative;
  }
  .band-card.selected .punch{ background:var(--ink); border-color:var(--ink); }
  .band-card.selected .punch::after{
    content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--paper); font-size:12px;
  }
  .band-label{ font-family:'Oswald',sans-serif; font-size:11px; text-align:center; letter-spacing:1px; }
  .band-label b{ display:block; font-size:15px; }
  .band-desc{ font-size:10.5px; line-height:1.4; color:var(--ink-soft); flex:1; }

  /* ---- total / actions ---- */
  .total-row{
    display:flex; justify-content:space-between; align-items:center;
    border-top:2px dashed var(--line); margin-top:10px; padding-top:16px;
  }
  .total-row .label{ font-family:'Oswald',sans-serif; letter-spacing:1px; font-size:13px; }
  .total-row .value{ font-size:28px; font-family:'Oswald',sans-serif; font-weight:700; }

  .btn{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px;
    font-weight:600; font-size:13px; padding:12px 18px; border:2px solid var(--ink);
    background:var(--ink); color:var(--paper); cursor:pointer;
  }
  .btn.secondary{ background:transparent; color:var(--ink); }
  .btn.amber{ border-color:var(--stamp-amber); background:var(--stamp-amber); color:var(--paper); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }

  .notice{ font-size:11.5px; padding:10px 12px; border-left:3px solid var(--stamp-amber); background:var(--hole); margin-top:14px; line-height:1.5;}
  .notice.err{ border-left-color:var(--stamp-red); color:var(--stamp-red); }

  /* ---- records list ---- */
  .search-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .search-row input{ flex:1 1 160px; }
  .record{
    border:1px solid var(--line); padding:12px 14px; margin-bottom:10px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .record:hover{ border-color:var(--stamp-amber); }
  .record .rname{ font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:0.5px;}
  .record .rmeta{ font-size:10.5px; color:var(--ink-soft); margin-top:3px;}
  .record .rscore{ font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; }
  .empty{ font-size:12px; color:var(--ink-soft); padding:20px 0; text-align:center; }
  .group-flag{ font-size:10px; color:var(--stamp-red); letter-spacing:0.5px; margin-top:2px; }

  /* ---- printable report ---- */
  #reportView{ display:none; }
  .report-line{ display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); padding:6px 0; font-size:12.5px; }
  .report-factor{ margin:14px 0; }
  .report-factor .rf-top{ display:flex; justify-content:space-between; font-family:'Oswald',sans-serif; font-size:13px; }
  .report-factor .rf-band{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .comments-box{ border:1.5px solid var(--line); padding:10px; font-size:12px; margin-top:6px; white-space:pre-wrap; min-height:40px;}

  @media print{
    body{ background:#fff; padding:0; }
    .tabs, .actions, #newPanel, #recordsPanel, .ticket::before, .ticket::after{ display:none !important; }
    #reportView{ display:block !important; }
    .ticket{ box-shadow:none; border:none; }
  }

  @media (max-width:560px){
    .bands{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="ticket">
    <div class="ticket-head">
      <div>
        <h1>Shift Slip</h1>
        <div class="sub">New-Hire Performance Ticket · F&amp;B Floor</div>
      </div>
      <div class="stamp">Confidential Review</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="new">New Evaluation</button>
      <button class="tab-btn" data-tab="records">Records</button>
    </div>

    <!-- ============ NEW EVALUATION PANEL ============ -->
    <div class="panel active" id="newPanel">

      <div class="field-row">
        <div class="field">
          <label>Evaluator name</label>
          <input type="text" id="evaluatorName" placeholder="Your name">
        </div>
        <div class="field">
          <label>Employee being evaluated</label>
          <input type="text" id="employeeName" placeholder="Employee name">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Job area / station</label>
          <input type="text" id="jobArea" placeholder="e.g. Grill Station, Front Counter, Bar">
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="evalDate">
        </div>
      </div>

      <div id="dupNotice"></div>

      <div id="factorsContainer"></div>

      <div class="field" style="margin-top:6px;">
        <label>Evaluator comments</label>
        <textarea id="comments" placeholder="Overall observations, specific incidents, recommendations..."></textarea>
      </div>

      <div class="total-row">
        <div class="label">Total Score</div>
        <div class="value"><span id="totalScore">0.00</span> / 5.00</div>
      </div>

      <div id="formNotice"></div>

      <div class="actions">
        <button class="btn amber" id="submitBtn">Submit &amp; Generate Slip</button>
        <button class="btn secondary" id="resetBtn">Clear Form</button>
      </div>
    </div>

    <!-- ============ RECORDS PANEL ============ -->
    <div class="panel" id="recordsPanel">
      <div class="search-row">
        <input type="text" id="searchName" placeholder="Filter by employee name">
        <input type="text" id="searchArea" placeholder="Filter by job area">
      </div>
      <div id="recordsList"></div>
    </div>
  </div>

  <!-- ============ PRINTABLE REPORT (also shown on-screen after submit) ============ -->
  <div class="ticket" id="reportView" style="margin-top:20px;">
    <div class="ticket-head">
      <div>
        <h1 id="rTitle">Evaluation Slip</h1>
        <div class="sub" id="rSub"></div>
      </div>
      <div class="stamp" id="rStamp">Filed</div>
    </div>
    <div class="panel active">
      <div class="report-line"><span>Employee</span><b id="rEmployee"></b></div>
      <div class="report-line"><span>Job area</span><b id="rArea"></b></div>
      <div class="report-line"><span>Evaluator</span><b id="rEvaluator"></b></div>
      <div class="report-line"><span>Date</span><b id="rDate"></b></div>

      <div id="rFactors"></div>

      <div class="total-row">
        <div class="label">Total Score</div>
        <div class="value"><span id="rTotal"></span> / 5.00</div>
      </div>

      <div class="field" style="margin-top:16px;">
        <label>Evaluator comments</label>
        <div class="comments-box" id="rComments"></div>
      </div>

      <div class="actions">
        <button class="btn amber" id="printBtn">Download / Print as PDF</button>
        <button class="btn secondary" id="backBtn">Back to Form</button>
      </div>
    </div>
  </div>

</div>

<script>
/* =========================================================
   DATA: factors + bands
   Band 4 = 1.00, Band 3 = 0.75, Band 2 = 0.50, Band 1 = 0.25
========================================================= */
const FACTORS = [
  {
    name: "Punctuality & Attendance",
    bands: [
      { band:4, points:1.00, label:"Reliable", desc:"Always arrives on time or early. No unexcused absences. Informs supervisor well in advance of any leave." },
      { band:3, points:0.75, label:"Mostly Reliable", desc:"Occasionally late (1–2x/month) but always informs supervisor beforehand. Attendance generally dependable." },
      { band:2, points:0.50, label:"Inconsistent", desc:"Frequently late or leaves early without notice. Attendance pattern is unpredictable and disrupts scheduling." },
      { band:1, points:0.25, label:"Unreliable", desc:"Habitually late or absent with little to no communication. Regularly disrupts shift planning." },
    ]
  },
  {
    name: "Job Knowledge & Task Execution",
    bands: [
      { band:4, points:1.00, label:"Proficient", desc:"Fully understands station duties, SOPs and menu items. Executes tasks correctly without supervision." },
      { band:3, points:0.75, label:"Competent", desc:"Understands most duties well. Occasionally needs guidance on less common or complex tasks." },
      { band:2, points:0.50, label:"Developing", desc:"Limited understanding of duties. Requires frequent reminders and correction to complete tasks." },
      { band:1, points:0.25, label:"Struggling", desc:"Little grasp of core duties despite training. Repeats the same mistakes shift after shift." },
    ]
  },
  {
    name: "Hygiene & Food Safety Compliance",
    bands: [
      { band:4, points:1.00, label:"Exemplary", desc:"Consistently follows hygiene and food-safety protocols (handwashing, PPE, storage temps) without prompting." },
      { band:3, points:0.75, label:"Compliant", desc:"Generally compliant. Occasional lapses that are corrected quickly once pointed out." },
      { band:2, points:0.50, label:"Needs Reminders", desc:"Inconsistent compliance. Requires regular reminders on basic hygiene practices." },
      { band:1, points:0.25, label:"Non-compliant", desc:"Frequently disregards hygiene or safety rules, posing a real risk to food safety." },
    ]
  },
  {
    name: "Communication & Teamwork",
    bands: [
      { band:4, points:1.00, label:"Collaborative", desc:"Communicates clearly with the team, proactively helps colleagues, and handles customer interactions well." },
      { band:3, points:0.75, label:"Cooperative", desc:"Communicates adequately and is cooperative when asked, with only occasional friction with the team." },
      { band:2, points:0.50, label:"Withdrawn", desc:"Communication is minimal or unclear. Limited willingness to assist others during busy periods." },
      { band:1, points:0.25, label:"Disruptive", desc:"Poor or disrespectful communication that creates conflict or isolates the worker from the team." },
    ]
  },
  {
    name: "Attitude, Discipline & Response to Feedback",
    bands: [
      { band:4, points:1.00, label:"Coachable", desc:"Positive attitude. Accepts feedback well and applies it immediately. Self-disciplined on the floor." },
      { band:3, points:0.75, label:"Responsive", desc:"Generally receptive to feedback but needs an occasional reminder to apply corrections consistently." },
      { band:2, points:0.50, label:"Resistant", desc:"Resistant to feedback and repeats mistakes that have already been corrected. Affects team morale." },
      { band:1, points:0.25, label:"Defiant", desc:"Dismissive or defensive toward feedback. Disciplinary issues persist despite prior warnings." },
    ]
  },
];

/* =========================================================
   STATE
========================================================= */
let selections = {}; // factorIndex -> bandObj
let currentRecord = null;

const $ = (id) => document.getElementById(id);

/* =========================================================
   BUILD FORM
========================================================= */
function buildFactors(){
  const container = $('factorsContainer');
  container.innerHTML = '';
  FACTORS.forEach((factor, fi) => {
    const div = document.createElement('div');
    div.className = 'factor';
    div.innerHTML = `
      <div class="factor-head">
        <h3><span class="factor-num">${fi+1}.</span> ${factor.name}</h3>
        <span class="factor-points" id="fp-${fi}">— / 1.00</span>
      </div>
      <div class="bands" id="bands-${fi}"></div>
    `;
    container.appendChild(div);
    const bandsEl = div.querySelector(`#bands-${fi}`);
    factor.bands.forEach(b => {
      const card = document.createElement('div');
      card.className = 'band-card';
      card.innerHTML = `
        <div class="punch"></div>
        <div class="band-label">Band ${b.band}<b>${b.label}</b></div>
        <div class="band-desc">${b.desc}</div>
      `;
      card.addEventListener('click', () => {
        selections[fi] = b;
        Array.from(bandsEl.children).forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        $(`fp-${fi}`).textContent = `${b.points.toFixed(2)} / 1.00`;
        updateTotal();
      });
      bandsEl.appendChild(card);
    });
  });
}

function updateTotal(){
  let total = 0;
  FACTORS.forEach((_, fi) => { if(selections[fi]) total += selections[fi].points; });
  $('totalScore').textContent = total.toFixed(2);
  return total;
}

/* =========================================================
   TABS
========================================================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    if(btn.dataset.tab === 'new'){ $('newPanel').classList.add('active'); }
    else { $('recordsPanel').classList.add('active'); loadRecords(); }
    $('reportView').style.display = 'none';
  });
});

/* =========================================================
   DUPLICATE CHECK (same name + same job area)
========================================================= */
let dupTimer = null;
function checkDuplicate(){
  clearTimeout(dupTimer);
  dupTimer = setTimeout(async () => {
    const name = $('employeeName').value.trim().toLowerCase();
    const area = $('jobArea').value.trim().toLowerCase();
    const notice = $('dupNotice');
    notice.innerHTML = '';
    if(!name || !area) return;
    const index = await getIndex();
    const matches = index.filter(r => r.employeeName.toLowerCase() === name && r.jobArea.toLowerCase() === area);
    if(matches.length > 0){
      notice.innerHTML = `<div class="notice">This worker already has <b>${matches.length}</b> prior evaluation(s) on file for this job area. This new slip will be filed under the same profile so other evaluators can review the full history in "Records".</div>`;
    }
  }, 400);
}
$('employeeName').addEventListener('input', checkDuplicate);
$('jobArea').addEventListener('input', checkDuplicate);

/* =========================================================
   STORAGE HELPERS (window.storage — shared so co-evaluators can see records)
========================================================= */
async function getIndex(){
  try{
    const res = await window.storage.get('records-index', true);
    return res ? JSON.parse(res.value) : [];
  } catch(e){ return []; }
}
async function saveIndex(index){
  await window.storage.set('records-index', JSON.stringify(index), true);
}
async function saveRecord(record){
  await window.storage.set('eval:' + record.id, JSON.stringify(record), true);
  const index = await getIndex();
  index.unshift({
    id: record.id, employeeName: record.employeeName, jobArea: record.jobArea,
    evaluatorName: record.evaluatorName, date: record.date, total: record.total
  });
  await saveIndex(index);
}
async function loadRecordFull(id){
  const res = await window.storage.get('eval:' + id, true);
  return res ? JSON.parse(res.value) : null;
}

/* =========================================================
   SUBMIT
========================================================= */
$('submitBtn').addEventListener('click', async () => {
  const evaluatorName = $('evaluatorName').value.trim();
  const employeeName = $('employeeName').value.trim();
  const jobArea = $('jobArea').value.trim();
  const evalDate = $('evalDate').value || new Date().toISOString().slice(0,10);
  const notice = $('formNotice');
  notice.innerHTML = '';

  if(!evaluatorName || !employeeName || !jobArea){
    notice.innerHTML = `<div class="notice err">Please fill in evaluator name, employee name and job area before submitting.</div>`;
    return;
  }
  if(Object.keys(selections).length < FACTORS.length){
    notice.innerHTML = `<div class="notice err">Please select a band for all ${FACTORS.length} factors before submitting.</div>`;
    return;
  }

  const total = updateTotal();
  const record = {
    id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    evaluatorName, employeeName, jobArea, date: evalDate,
    factors: FACTORS.map((f, fi) => ({
      name: f.name, band: selections[fi].band, label: selections[fi].label,
      desc: selections[fi].desc, points: selections[fi].points
    })),
    comments: $('comments').value.trim(),
    total
  };

  $('submitBtn').disabled = true;
  $('submitBtn').textContent = 'Filing...';
  try{
    await saveRecord(record);
    showReport(record);
  } catch(e){
    notice.innerHTML = `<div class="notice err">Could not save this evaluation (storage error). You can still print/download the slip below.</div>`;
    showReport(record);
  }
  $('submitBtn').disabled = false;
  $('submitBtn').textContent = 'Submit & Generate Slip';
});

$('resetBtn').addEventListener('click', () => {
  $('evaluatorName').value = '';
  $('employeeName').value = '';
  $('jobArea').value = '';
  $('evalDate').value = '';
  $('comments').value = '';
  $('dupNotice').innerHTML = '';
  $('formNotice').innerHTML = '';
  selections = {};
  buildFactors();
  updateTotal();
});

/* =========================================================
   REPORT / PDF VIEW
========================================================= */
function scoreStampWord(total){
  if(total >= 4.0) return { word:"Strong", color:"var(--stamp-green)" };
  if(total >= 3.0) return { word:"Satisfactory", color:"var(--stamp-green)" };
  if(total >= 2.0) return { word:"Needs Improvement", color:"var(--stamp-amber)" };
  return { word:"Unsatisfactory", color:"var(--stamp-red)" };
}

function showReport(record){
  currentRecord = record;
  $('rSub').textContent = `Filed ${record.date} · Job Area: ${record.jobArea}`;
  $('rEmployee').textContent = record.employeeName;
  $('rArea').textContent = record.jobArea;
  $('rEvaluator').textContent = record.evaluatorName;
  $('rDate').textContent = record.date;
  $('rTotal').textContent = record.total.toFixed(2);
  $('rComments').textContent = record.comments || '—';

  const stamp = scoreStampWord(record.total);
  const stampEl = $('rStamp');
  stampEl.textContent = stamp.word;
  stampEl.style.borderColor = stamp.color;
  stampEl.style.color = stamp.color;

  const rf = $('rFactors');
  rf.innerHTML = '';
  record.factors.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'report-factor';
    div.innerHTML = `
      <div class="rf-top"><span>${i+1}. ${f.name}</span><span>${f.points.toFixed(2)} / 1.00</span></div>
      <div class="rf-band">Band ${f.band} — ${f.label}: ${f.desc}</div>
    `;
    rf.appendChild(div);
  });

  document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
  $('reportView').style.display = 'block';
  $('reportView').scrollIntoView({ behavior:'smooth' });
}

$('printBtn').addEventListener('click', () => window.print());
$('backBtn').addEventListener('click', () => {
  $('reportView').style.display = 'none';
  document.querySelectorAll('.panel').forEach(p => p.style.display = '');
  $('newPanel').classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="new"]').classList.add('active');
});

/* =========================================================
   RECORDS PANEL
========================================================= */
async function loadRecords(){
  const list = $('recordsList');
  list.innerHTML = '<div class="empty">Loading records...</div>';
  const index = await getIndex();
  renderRecords(index);
}

function renderRecords(index){
  const nameFilter = $('searchName').value.trim().toLowerCase();
  const areaFilter = $('searchArea').value.trim().toLowerCase();
  let filtered = index.filter(r =>
    (!nameFilter || r.employeeName.toLowerCase().includes(nameFilter)) &&
    (!areaFilter || r.jobArea.toLowerCase().includes(areaFilter))
  );
  const list = $('recordsList');
  list.innerHTML = '';
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">No evaluations on file yet.</div>';
    return;
  }
  // group counts by name+area to flag repeat profiles
  const groupCounts = {};
  index.forEach(r => {
    const key = r.employeeName.toLowerCase() + '|' + r.jobArea.toLowerCase();
    groupCounts[key] = (groupCounts[key] || 0) + 1;
  });

  filtered.forEach(r => {
    const key = r.employeeName.toLowerCase() + '|' + r.jobArea.toLowerCase();
    const count = groupCounts[key];
    const div = document.createElement('div');
    div.className = 'record';
    div.innerHTML = `
      <div>
        <div class="rname">${r.employeeName}</div>
        <div class="rmeta">${r.jobArea} · evaluated by ${r.evaluatorName} · ${r.date}</div>
        ${count > 1 ? `<div class="group-flag">${count} evaluations on file for this worker in this job area</div>` : ''}
      </div>
      <div class="rscore">${r.total.toFixed(2)}</div>
    `;
    div.addEventListener('click', async () => {
      const full = await loadRecordFull(r.id);
      if(full) showReport(full);
    });
    list.appendChild(div);
  });
}

$('searchName').addEventListener('input', () => loadRecords());
$('searchArea').addEventListener('input', () => loadRecords());

/* =========================================================
   INIT
========================================================= */
buildFactors();
updateTotal();
$('evalDate').value = new Date().toISOString().slice(0,10);
</script>
</body>
</html>
